name: Provider templates

on:
  push:
    paths: ['plugins/community/provider-templates/**']
  pull_request:
    paths: ['plugins/community/provider-templates/**']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the templates
        run: php plugins/community/provider-templates/tests/validate.php
