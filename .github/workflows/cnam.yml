name: CNAM plugin

on:
  push:
    paths: ['plugins/community/cnam/**']
  pull_request:
    paths: ['plugins/community/cnam/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: find plugins/community/cnam -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Providers & Unit Tests
        run: |
          php plugins/community/cnam/tests/cnam_test.php
          php plugins/community/cnam/tests/security_test.php
